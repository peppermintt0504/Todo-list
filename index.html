<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d1f23; --muted:#8a8f98; --accent:#3b6cf6; --line:#e6e8ec; --ok:#2f9e5b; --err:#e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141518; --card:#1d1f23; --text:#e8e9ec; --muted:#7d828b; --accent:#6d93ff; --line:#2c2f35; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:480px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:28px; margin:0; }
  #status { font-size:13px; color:var(--muted); }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  form.add-form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text], input[type=password] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
         background:var(--card); color:var(--text); font-size:16px; width:100%; }
  button { border:0; border-radius:10px; cursor:pointer; font-size:15px; }
  .primary { padding:0 18px; background:var(--accent); color:#fff; }
  .filters { display:flex; gap:6px; margin-bottom:12px; }
  .filters button { padding:6px 12px; background:transparent; color:var(--muted); }
  .filters button.on { background:var(--card); color:var(--text); border:1px solid var(--line); }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li input { width:18px; height:18px; accent-color:var(--accent); }
  li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  .del { background:transparent; color:var(--muted); font-size:18px; padding:2px 6px; }
  .del:hover { color:var(--err); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  footer { display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-size:14px; }
  footer button { background:transparent; color:var(--muted); }
  details { margin-top:28px; color:var(--muted); font-size:14px; }
  details summary { cursor:pointer; }
  .settings { display:grid; gap:8px; margin-top:12px; }
  .settings label { display:grid; gap:4px; }
  .settings .row { display:flex; gap:8px; }
  .settings .row button { padding:10px 14px; }
  .ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <header>
    <h1>할 일</h1>
    <span id="status"></span>
  </header>
  <form class="add-form" id="form">
    <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button class="primary" type="submit">추가</button>
  </form>
  <div class="filters">
    <button data-f="all" class="on">전체</button>
    <button data-f="active">진행 중</button>
    <button data-f="done">완료</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clear">완료 항목 삭제</button>
  </footer>

  <details id="settingsBox">
    <summary>동기화 설정</summary>
    <form class="settings" id="settings">
      <label>GitHub 토큰 (이 브라우저에만 저장)
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      </label>
      <label>저장소 (owner/repo)
        <input id="repo" type="text" autocomplete="off">
      </label>
      <div class="row">
        <button class="primary" type="submit">저장 후 동기화</button>
        <button class="ghost" type="button" id="logout">토큰 지우기</button>
      </div>
    </form>
  </details>
</main>
<script>
  // ---- 로컬 저장 (캐시 + 오프라인 대기열) ----
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const DEFAULT_REPO = "peppermintt0504/todo-data";
  const FILE = "todos.json";

  let todos = LS.get("todos-v1", []);   // 화면에 보이는 목록 (마지막으로 알고 있는 상태)
  let pending = LS.get("pending-v1", []); // 아직 서버에 반영 안 된 변경
  let cfg = { token: LS.get("gh-token", ""), repo: LS.get("gh-repo", DEFAULT_REPO) };
  let filter = "all";
  let syncing = false, again = false;

  const $ = id => document.getElementById(id);
  const persist = () => { LS.set("todos-v1", todos); LS.set("pending-v1", pending); };
  const setStatus = (text, cls = "") => { const s = $("status"); s.textContent = text; s.className = cls; };

  // ---- 변경 적용 (로컬/원격 공통) ----
  function apply(list, op) {
    switch (op.type) {
      case "add":    return list.some(t => t.id === op.item.id) ? list : [...list, op.item];
      case "toggle": return list.map(t => t.id === op.id ? { ...t, done: op.done } : t);
      case "del":    return list.filter(t => t.id !== op.id);
      case "clear":  return list.filter(t => !op.ids.includes(t.id));
    }
    return list;
  }
  function act(op) {
    todos = apply(todos, op);
    pending.push(op);
    persist(); render(); sync();
  }

  // ---- GitHub Contents API ----
  const b64encode = s => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
  const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
  const api = (path, opts = {}) => fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`, {
    ...opts,
    cache: "no-store",
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });

  async function readRemote() {
    const r = await api(FILE);
    if (r.status === 404) return { list: [], sha: null };
    if (!r.ok) throw new Error(`읽기 실패 (${r.status})`);
    const j = await r.json();
    return { list: JSON.parse(b64decode(j.content) || "[]"), sha: j.sha };
  }

  async function sync() {
    if (!cfg.token) { setStatus(pending.length ? "로컬에만 저장됨" : "동기화 꺼짐"); return; }
    if (syncing) { again = true; return; }
    syncing = true;
    setStatus("동기화 중…");
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const { list, sha } = await readRemote();
        const sent = pending.slice();
        if (!sent.length) { todos = list; persist(); render(); setStatus("동기화됨", "ok"); break; }
        const merged = sent.reduce(apply, list);
        const body = { message: "update todos", content: b64encode(JSON.stringify(merged, null, 2)) };
        if (sha) body.sha = sha;
        const r = await api(FILE, { method: "PUT", body: JSON.stringify(body) });
        if (r.status === 409 || r.status === 422) continue; // 다른 기기가 먼저 저장함 → 다시 읽고 재시도
        if (!r.ok) throw new Error(`저장 실패 (${r.status})`);
        pending = pending.slice(sent.length);
        todos = pending.reduce(apply, merged);
        persist(); render();
        setStatus("동기화됨", "ok");
        if (!pending.length) break;
      }
    } catch (e) {
      setStatus(e.message.includes("401") ? "토큰 오류 (401)" : e.message.includes("404") ? "저장소를 찾을 수 없음" : (e.message || "네트워크 오류"), "err");
    } finally {
      syncing = false;
      if (again) { again = false; sync(); }
    }
  }

  // ---- 화면 ----
  function render() {
    const list = $("list");
    const shown = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    list.innerHTML = "";
    if (!shown.length) list.innerHTML = '<li class="empty">항목이 없습니다</li>';
    for (const t of shown) {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.onchange = () => act({ type: "toggle", id: t.id, done: cb.checked });
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×"; del.title = "삭제";
      del.onclick = () => act({ type: "del", id: t.id });
      li.append(cb, span, del);
      list.append(li);
    }
    $("count").textContent = `남은 할 일 ${todos.filter(t => !t.done).length}개`;
  }

  $("form").onsubmit = e => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    $("input").value = "";
    act({ type: "add", item: { id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, text, done: false, created: new Date().toISOString() } });
  };
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  $("clear").onclick = () => {
    const ids = todos.filter(t => t.done).map(t => t.id);
    if (ids.length) act({ type: "clear", ids });
  };

  // ---- 설정 ----
  $("token").value = cfg.token;
  $("repo").value = cfg.repo;
  if (!cfg.token) $("settingsBox").open = true;
  $("settings").onsubmit = e => {
    e.preventDefault();
    cfg.token = $("token").value.trim();
    cfg.repo = $("repo").value.trim() || DEFAULT_REPO;
    LS.set("gh-token", cfg.token); LS.set("gh-repo", cfg.repo);
    $("settingsBox").open = false;
    sync();
  };
  $("logout").onclick = () => {
    cfg.token = ""; LS.del("gh-token"); $("token").value = "";
    setStatus("동기화 꺼짐");
  };

  // 다른 기기에서 바꾼 내용 반영: 탭으로 돌아올 때 다시 불러오기
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  window.addEventListener("online", sync);

  render();
  sync();
</script>
</body>
</html>
