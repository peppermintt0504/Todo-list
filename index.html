<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d1f23; --muted:#8a8f98; --accent:#3b6cf6; --line:#e6e8ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141518; --card:#1d1f23; --text:#e8e9ec; --muted:#7d828b; --accent:#6d93ff; --line:#2c2f35; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:480px; }
  h1 { font-size:28px; margin:0 0 20px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
         background:var(--card); color:var(--text); font-size:16px; }
  button { border:0; border-radius:10px; cursor:pointer; font-size:15px; }
  .add { padding:0 18px; background:var(--accent); color:#fff; }
  .filters { display:flex; gap:6px; margin-bottom:12px; }
  .filters button { padding:6px 12px; background:transparent; color:var(--muted); }
  .filters button.on { background:var(--card); color:var(--text); border:1px solid var(--line); }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li input { width:18px; height:18px; accent-color:var(--accent); }
  li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  .del { background:transparent; color:var(--muted); font-size:18px; padding:2px 6px; }
  .del:hover { color:#e5484d; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  footer { display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-size:14px; }
  footer button { background:transparent; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>할 일</h1>
  <form id="form">
    <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button class="add" type="submit">추가</button>
  </form>
  <div class="filters">
    <button data-f="all" class="on">전체</button>
    <button data-f="active">진행 중</button>
    <button data-f="done">완료</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clear">완료 항목 삭제</button>
  </footer>
</main>
<script>
  const KEY = "todos-v1";
  let todos = [];
  let filter = "all";
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch { todos = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };

  const list = document.getElementById("list");
  const input = document.getElementById("input");

  function render() {
    const shown = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    list.innerHTML = "";
    if (!shown.length) {
      list.innerHTML = '<li class="empty">항목이 없습니다</li>';
    }
    for (const t of shown) {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×"; del.title = "삭제";
      del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };
      li.append(cb, span, del);
      list.append(li);
    }
    const left = todos.filter(t => !t.done).length;
    document.getElementById("count").textContent = `남은 할 일 ${left}개`;
  }

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now() + Math.random(), text, done: false });
    input.value = "";
    save(); render();
  };
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.getElementById("clear").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
  render();
</script>
</body>
</html>
